<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ID Card Scanner (Free)</title>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>
:root{--bg:#f6f7f5;--card:#fff;--tx:#1b2a22;--mut:#6b7a72;--ac:#0f5c3f;--bd:#dde3df;--ok:#1a7f4b;--warn:#b26a00;--err:#b3261e}
@media (prefers-color-scheme:dark){:root{--bg:#121715;--card:#1b231f;--tx:#e8efea;--mut:#9aa8a0;--ac:#2f9e72;--bd:#2c3832;--ok:#5fd09b;--warn:#f0b050;--err:#f2b8b5}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.35 system-ui,sans-serif;padding-bottom:84px}
.top{position:sticky;top:0;z-index:5;background:var(--bg);padding:8px 10px 6px;border-bottom:1px solid var(--bd)}
.cam{position:relative;background:#000;border-radius:12px;overflow:hidden;height:32vh;display:none}
video{width:100%;height:100%;object-fit:cover}
#shot{position:absolute;left:50%;bottom:10px;transform:translateX(-50%);width:64px;height:64px;border-radius:50%;border:4px solid #fff;background:rgba(255,255,255,.35);padding:0;flex:none}
#shot:active{background:#fff}
.btns{display:flex;gap:8px;margin-top:6px}
.btn,button{flex:1;border:0;border-radius:10px;padding:11px;font-size:15px;font-weight:600;background:var(--ac);color:#fff;text-align:center}
.sec{background:var(--card)!important;color:var(--tx)!important;border:1px solid var(--bd)!important}
#status{font-size:13px;color:var(--mut);margin-top:6px}
.sum{display:flex;justify-content:space-between;padding:10px 12px;font-size:13px;color:var(--mut)}
.row{display:flex;gap:8px;padding:8px 10px;margin:0 10px 8px;background:var(--card);border:1px solid var(--bd);border-left-width:5px;border-radius:12px;align-items:flex-start}
.row.queued,.row.reading{border-left-color:var(--mut)}
.row.ok{border-left-color:var(--ok)}.row.check{border-left-color:var(--warn)}.row.dup,.row.failed{border-left-color:var(--err)}
.th{width:54px;height:72px;border-radius:6px;background:var(--bd) center/cover;flex:none;position:relative}
.n{position:absolute;left:2px;top:2px;background:rgba(0,0,0,.65);color:#fff;font-size:11px;border-radius:5px;padding:0 5px}
.f{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.f input{width:100%;border:1px solid var(--bd);border-radius:7px;padding:6px 8px;font-size:14px;background:var(--bg);color:var(--tx)}
.two{display:flex;gap:4px}.two input:first-child{width:38%}
.badge{font-size:12px;font-weight:600;display:flex;gap:10px;align-items:center}
.badge a{color:var(--err);text-decoration:none}.badge .del{margin-left:auto;font-size:18px}
.bar{position:fixed;left:0;right:0;bottom:0;padding:10px;background:var(--bg);border-top:1px solid var(--bd);display:flex;gap:8px}
button:disabled{opacity:.5}
</style></head><body>
<div class="top">
  <div class="cam" id="camBox"><video id="v" playsinline muted autoplay></video><button id="shot" aria-label="Capture"></button></div>
  <div class="btns">
    <label class="btn sec">📷 Camera app<input id="file" type="file" accept="image/*" capture="environment" hidden></label>
    <label class="btn sec">🖼 Gallery (many)<input id="gal" type="file" accept="image/*" multiple hidden></label>
  </div>
  <div id="status">Loading reader… (first time needs internet)</div>
</div>
<div class="sum"><span id="sum">Nothing scanned yet</span><a href="#" id="clear" style="color:var(--err)">Clear all</a></div>
<div id="list"></div>
<div class="bar"><button id="dl" disabled>Download Excel</button></div>

<script>
const SCHOOL="01769975771", MAXQ=25, MAXKEEP=12;
const $=i=>document.getElementById(i), st=t=>$("status").textContent=t;
let entries=[], worker=null, sample=null, running=false, counter=0;

/* saved list: text only, never images */
function save(){try{localStorage.setItem("ids2",JSON.stringify(entries.filter(e=>e.status!=="failed").map(e=>({n:e.n,id:e.id,name:e.name,phone:e.phone,status:e.status}))))}catch(e){}}
function restore(){
  let a=[];try{a=JSON.parse(localStorage.getItem("ids2")||"[]")}catch(e){}
  a.forEach(o=>{const e=mk(o.n);e.id=o.id;e.name=o.name;e.phone=o.phone;e.status=(o.status==="queued"||o.status==="reading")?"check":o.status;counter=Math.max(counter,o.n);paint(e)});
  summary();
}

/* rows */
const valid=e=>e.id&&e.name&&/^01\d{9}$/.test(e.phone.replace(/\D/g,""));
const LABEL={queued:"⏳ Waiting",reading:"🔍 Reading…",ok:"✅ OK",check:"⚠️ Please check",dup:"🔁 Duplicate ID (not exported)",failed:"❌ Couldn’t read"};
function mk(n){
  const e={n,id:"",name:"",phone:"",status:"queued",blob:null,thumb:""};
  const r=document.createElement("div");r.className="row";
  r.innerHTML='<div class="th"><span class="n">'+n+'</span></div><div class="f"><div class="two"><input data-k="id" placeholder="Student ID" inputmode="numeric"><input data-k="phone" placeholder="Phone" inputmode="tel"></div><input data-k="name" placeholder="Name"><div class="badge"><span class="s"></span><span class="retry"></span><a href="#" class="del">×</a></div></div>';
  r.querySelectorAll("input").forEach(inp=>inp.oninput=()=>{e[inp.dataset.k]=inp.value;if(e.status==="ok"||e.status==="check")e.status=valid(e)?"ok":"check";paint(e,true);save();summary()});
  r.querySelector(".del").onclick=ev=>{ev.preventDefault();e.blob=null;entries=entries.filter(x=>x!==e);r.remove();save();summary()};
  e.el=r;$("list").append(r);entries.push(e);return e;
}
function paint(e,keep){
  const r=e.el;r.className="row "+e.status;
  if(!keep)r.querySelectorAll("input").forEach(i=>i.value=e[i.dataset.k]);
  r.querySelector(".s").textContent=LABEL[e.status];
  if(e.thumb)r.querySelector(".th").style.backgroundImage="url("+e.thumb+")";
  const rt=r.querySelector(".retry");rt.textContent="";
  if(e.status==="failed"&&e.blob){const a=document.createElement("a");a.href="#";a.textContent="Retry";a.onclick=ev=>{ev.preventDefault();e.status="queued";paint(e,true);pump()};rt.append(a)}
}
function summary(){
  const c=s=>entries.filter(e=>e.status===s).length,q=c("queued")+c("reading");
  $("sum").textContent=entries.length?`${c("ok")} OK · ${c("check")} to check · ${q} in queue`+(c("failed")?` · ${c("failed")} failed`:""):"Nothing scanned yet";
  $("dl").disabled=!entries.some(e=>e.status==="ok"||e.status==="check");
}

/* capture: instant, never waits for reading */
const pending=()=>entries.filter(e=>e.status==="queued"||e.status==="reading").length;
async function enqueue(src,w,h){
  if(pending()>=MAXQ){st("Queue full ("+MAXQ+") — wait for reading to catch up.");return false}
  const k=Math.min(1,1600/Math.max(w,h)),c=document.createElement("canvas");
  c.width=Math.round(w*k);c.height=Math.round(h*k);c.getContext("2d").drawImage(src,0,0,c.width,c.height);
  const t=document.createElement("canvas");t.width=108;t.height=144;
  const s=Math.max(t.width/c.width,t.height/c.height);
  t.getContext("2d").drawImage(c,(t.width-c.width*s)/2,(t.height-c.height*s)/2,c.width*s,c.height*s);
  const e=mk(++counter);e.thumb=t.toDataURL("image/jpeg",.6);
  e.blob=await new Promise(r=>c.toBlob(r,"image/jpeg",.85));
  c.width=c.height=t.width=t.height=0;
  paint(e);summary();st("Captured #"+e.n+" — keep going, reading happens in the background.");
  e.el.scrollIntoView({block:"nearest"});pump();return true;
}

/* reading queue: one at a time, full image freed once read */
function prep(img,invert){
  const k=Math.min(1.5,1500/Math.max(img.width,img.height)),c=document.createElement("canvas");
  c.width=Math.round(img.width*k);c.height=Math.round(img.height*k);
  const g=c.getContext("2d");g.drawImage(img,0,0,c.width,c.height);
  const im=g.getImageData(0,0,c.width,c.height),d=im.data;
  for(let i=0;i<d.length;i+=4){let y=.3*d[i]+.59*d[i+1]+.11*d[i+2];y=Math.max(0,Math.min(255,(y-128)*1.4+128));if(invert)y=255-y;d[i]=d[i+1]=d[i+2]=y}
  g.putImageData(im,0,0);return c;
}
const BAD=/COLLEGE|SHAHEEN|DHAKA|CANTONMENT|STUDENT|PRINCIPAL|EMERGENCY|VALIDITY|HUMANITIES|SCIENCE|BUSINESS|GROUP|SESSION|CLASS|VERSION|BLOOD|GUARDIAN|EMAIL|CELL|BAFSD|CALL/;
function parse(texts){
  const all=texts.join("\n"),lines=all.split("\n").map(s=>s.trim()).filter(Boolean);
  let id="",m=all.match(/ID\s*[:;.\-]?\s*(\d[\d\s]{4,8}\d)/i);
  if(m)id=m[1].replace(/\s/g,"");
  if(!id){const n=all.match(/\b(\d{6})\b/);if(n)id=n[1]}
  let idLine=-1;lines.forEach((l,i)=>{if(id&&idLine<0&&l.replace(/\s/g,"").includes(id))idLine=i});
  const cands=[];
  lines.forEach((l,i)=>{
    const t=l.replace(/[^A-Za-z .]/g,"").replace(/\s+/g," ").trim();
    if(t.split(" ").length<2||t.length<8)return;
    const up=(t.match(/[A-Z]/g)||[]).length,lt=(t.match(/[A-Za-z]/g)||[]).length;
    if(lt&&up/lt>=.75&&!BAD.test(t.toUpperCase()))cands.push({t:t.toUpperCase(),i});
  });
  const nm=cands.find(c=>c.i>idLine)||cands[0];
  let phone="";
  const em=all.match(/emergency[^0-9]{0,14}([0-9OoIl][0-9OoIl\s\-]{9,14})/i);
  if(em){const p=em[1].replace(/[Oo]/g,"0").replace(/[Il]/g,"1").replace(/\D/g,"");const q=p.match(/01[3-9]\d{8}/);if(q&&q[0]!==SCHOOL)phone=q[0]}
  if(!phone){const f=all.replace(/[\s\-]/g,"");const a=(f.match(/01[3-9]\d{8}/g)||[]).filter(x=>x!==SCHOOL);if(a.length)phone=a[a.length-1]}
  return {id,name:nm?nm.t:"",phone};
}
async function pump(){
  if(running||(!worker&&!sample))return;running=true;
  let e;
  while((e=entries.find(x=>x.status==="queued"&&x.blob))){
    e.status="reading";paint(e,true);summary();
    try{
      let r;
      if(worker){const img=await createImageBitmap(e.blob);
        const a=await worker.recognize(prep(img,true));
        const b=await worker.recognize(prep(img,false));
        img.close();r=parse([a.data.text,b.data.text])}
      else{const j=await sample.json("This image is a student ID card. Read the Student ID number, the student’s full name, and the Emergency Call phone number (not the college’s own number 01769975771). Respond ONLY with JSON {\"id\":\"\",\"name\":\"\",\"phone\":\"\"}; use empty strings if unreadable; do not guess.",{images:[e.blob],modelTier:"quick",cache:false});
        r={id:String(j.id||"").trim(),name:String(j.name||"").replace(/\s+/g," ").trim().toUpperCase(),phone:String(j.phone||"").replace(/\D/g,"")}}
      e.id=r.id;e.name=r.name;e.phone=r.phone;
      if(!r.id&&!r.name&&!r.phone)e.status="failed";
      else if(r.id&&entries.some(x=>x!==e&&x.id===r.id&&x.status!=="dup")){e.status="dup";e.blob=null}
      else{e.status=valid(e)?"ok":"check";e.blob=null}
    }catch(err){if(err&&err.code==="rate_limited"){e.status="queued";st("Slow down — waiting a few seconds…");await new Promise(r=>setTimeout(r,5000))}else e.status="failed"}
    const f=entries.filter(x=>x.status==="failed"&&x.blob);f.slice(0,Math.max(0,f.length-MAXKEEP)).forEach(x=>x.blob=null);
    paint(e);save();summary();
    await new Promise(r=>setTimeout(r,30));
  }
  running=false;st(pending()?"Reading…":"All caught up. Scan the next card.");
}

/* setup */
async function init(){
  restore();
  try{worker=await Promise.race([Tesseract.createWorker("eng"),new Promise((_,j)=>setTimeout(()=>j(new Error("timeout")),15000))]);st("Ready. Capture cards one after another.");pump()}
  catch(e){worker=null;try{sample=await claude.use("sample")}catch(x){}
    st(sample?"Ready (Claude reads the cards). Capture cards one after another.":"Could not load the card reader here.");pump()}
  try{
    const s=await navigator.mediaDevices.getUserMedia({video:{facingMode:"environment",width:{ideal:1920}}});
    $("v").srcObject=s;$("camBox").style.display="block";
    const grab=()=>{const v=$("v");if(v.videoWidth)enqueue(v,v.videoWidth,v.videoHeight)};
    $("shot").onclick=ev=>{ev.stopPropagation();grab()};$("v").onclick=grab;
  }catch(e){st("Live camera not available here — use “Camera app” or “Gallery”. (Host the file on https for live camera.)")}
}
$("file").onchange=async ev=>{for(const f of ev.target.files){const b=await createImageBitmap(f);await enqueue(b,b.width,b.height);b.close()}ev.target.value=""};
$("gal").onchange=async ev=>{for(const f of ev.target.files){while(pending()>=MAXQ)await new Promise(r=>setTimeout(r,500));const b=await createImageBitmap(f);await enqueue(b,b.width,b.height);b.close()}ev.target.value=""};
$("clear").onclick=ev=>{ev.preventDefault();if(entries.length&&confirm("Remove ALL scanned students?")){entries.forEach(e=>e.el.remove());entries=[];save();summary()}};

/* Excel download: plain browser download (works locally and on GitHub Pages) */
$("dl").onclick=()=>{
  if(typeof XLSX==="undefined"){st("Excel library didn’t load. Check internet and reload.");return}
  const rows=entries.filter(e=>e.status==="ok"||e.status==="check").map(e=>[e.n,e.id,e.name,e.phone,e.status==="ok"?"OK":"CHECK"]);
  const ws=XLSX.utils.aoa_to_sheet([["#","Student ID","Name","Phone (emergency)","Status"],...rows]);
  ws["!cols"]=[{wch:5},{wch:12},{wch:32},{wch:18},{wch:8}];
  const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,"Students");
  const data=XLSX.write(wb,{type:"array",bookType:"xlsx"});
  const blob=new Blob([data],{type:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"});
  const a=document.createElement("a");
  a.href=URL.createObjectURL(blob);
  a.download="students.xlsx";
  document.body.append(a);a.click();
  setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},4000);
  st("Excel downloaded ("+rows.length+" rows). Check your Downloads folder.");
};
init();
</script></body></html>
