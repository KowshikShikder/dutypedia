<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ID Card Scanner (Free)</title>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>
:root{--bg:#f6f7f5;--card:#fff;--tx:#1b2a22;--mut:#6b7a72;--ac:#0f5c3f;--bd:#dde3df;--ok:#1a7f4b;--warn:#b26a00;--err:#b3261e}
@media (prefers-color-scheme:dark){:root{--bg:#121715;--card:#1b231f;--tx:#e8efea;--mut:#9aa8a0;--ac:#2f9e72;--bd:#2c3832;--ok:#5fd09b;--warn:#f0b050;--err:#f2b8b5}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.35 system-ui,sans-serif;padding-bottom:84px}
.top{position:sticky;top:0;z-index:5;background:var(--bg);padding:8px 10px 6px;border-bottom:1px solid var(--bd)}
.cam{position:relative;background:#000;border-radius:12px;overflow:hidden;height:32vh;display:none}
video{width:100%;height:100%;object-fit:cover}
#shot{position:absolute;left:50%;bottom:10px;transform:translateX(-50%);width:64px;height:64px;border-radius:50%;border:4px solid #fff;background:rgba(255,255,255,.35);padding:0;flex:none}
#shot:active{background:#fff}
.btns{display:flex;gap:8px;margin-top:6px}
.btn,button{flex:1;border:0;border-radius:10px;padding:11px;font-size:15px;font-weight:600;background:var(--ac);color:#fff;text-align:center}
.sec{background:var(--card)!important;color:var(--tx)!important;border:1px solid var(--bd)!important}
#status{font-size:13px;color:var(--mut);margin-top:6px}
.sum{display:flex;justify-content:space-between;padding:10px 12px;font-size:13px;color:var(--mut)}
.row{display:flex;gap:8px;padding:8px 10px;margin:0 10px 8px;background:var(--card);border:1px solid var(--bd);border-left-width:5px;border-radius:12px;align-items:flex-start}
.row.queued,.row.reading{border-left-color:var(--mut)}
.row.ok{border-left-color:var(--ok)}.row.check{border-left-color:var(--warn)}.row.dup,.row.failed{border-left-color:var(--err)}
.th{width:54px;height:72px;border-radius:6px;background:var(--bd) center/cover;flex:none;position:relative}
.n{position:absolute;left:2px;top:2px;background:rgba(0,0,0,.65);color:#fff;font-size:11px;border-radius:5px;padding:0 5px}
.f{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.f input{width:100%;border:1px solid var(--bd);border-radius:7px;padding:6px 8px;font-size:14px;background:var(--bg);color:var(--tx)}
.two{display:flex;gap:4px}.two input:first-child{width:38%}
.badge{font-size:12px;font-weight:600;display:flex;gap:10px;align-items:center}
.badge a{color:var(--err);text-decoration:none}.badge .del{margin-left:auto;font-size:18px}
.bar{position:fixed;left:0;right:0;bottom:0;padding:10px;background:var(--bg);border-top:1px solid var(--bd);display:flex;gap:8px}
button:disabled{opacity:.5}
</style></head><body>
<div class="top">
  <div class="cam" id="camBox"><video id="v" playsinline muted autoplay></video><button id="shot" aria-label="Capture"></button></div>
  <div class="btns">
    <label class="btn sec">📷 Camera app<input id="file" type="file" accept="image/*" capture="environment" hidden></label>
    <label class="btn sec">🖼 Gallery (many)<input id="gal" type="file" accept="image/*" multiple hidden></label>
  </div>
  <div id="status">Loading reader… (first time needs internet)</div>
</div>
<div class="sum"><span id="sum">Nothing scanned yet</span><a href="#" id="clear" style="color:var(--err)">Clear all</a></div>
<div id="list"></div>
<div class="bar"><button id="dl" disabled>Download Excel</button></div>
