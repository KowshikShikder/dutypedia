<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KG Final Selection 2027 – Control Desk</title>
<style>
:root{
  --navy:#0b2545; --navy2:#13315c; --gold:#c9a227; --gold-soft:#f6ecc4;
  --bg:#f3f1ec; --card:#fff; --ink:#15202b; --muted:#5b6673; --line:#e0dbcd;
  --ok:#17693f; --ok-bg:#e1f3e8; --bad:#a6231b; --bad-bg:#fbe5e2;
  --pres:#0a5db3; --pres-bg:#e1edfb; --warn:#8a5a00; --warn-bg:#fff1d6;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans","Noto Sans Bengali",Arial,sans-serif}
header{background:linear-gradient(135deg,var(--navy),var(--navy2));color:#fff;border-bottom:4px solid var(--gold)}
.hwrap{max-width:1100px;margin:0 auto;padding:14px 16px;display:flex;flex-wrap:wrap;gap:8px 20px;align-items:center;justify-content:space-between}
.hwrap h1{margin:0;font-size:19px;letter-spacing:.2px}
.hwrap .college{font-size:12px;letter-spacing:1.2px;text-transform:uppercase;color:var(--gold);font-weight:600}
.hwrap .sub{font-size:13px;opacity:.85}
.when{background:rgba(255,255,255,.1);border:1px solid rgba(201,162,39,.6);border-radius:8px;padding:6px 12px;font-size:13px;text-align:right}
.when b{color:var(--gold-soft)}
nav{position:sticky;top:0;z-index:5;background:var(--navy);box-shadow:0 2px 6px rgba(0,0,0,.2)}
.tabs{max-width:1100px;margin:0 auto;display:flex;gap:2px;padding:0 8px;overflow-x:auto}
.tabs button{background:none;border:0;color:#c9d3e3;padding:12px 16px;font:600 14px inherit;font-family:inherit;cursor:pointer;border-bottom:3px solid transparent;white-space:nowrap}
.tabs button[aria-selected=true]{color:#fff;border-bottom-color:var(--gold)}
.tabs button:focus-visible{outline:2px solid var(--gold);outline-offset:-2px}
main{max-width:1100px;margin:0 auto;padding:16px}
section[hidden]{display:none}

/* search */
.searchbox{position:relative}
.searchbox input{width:100%;padding:16px 46px 16px 16px;font-size:19px;border:2px solid var(--navy2);border-radius:12px;background:#fff;color:var(--ink)}
.searchbox input:focus{outline:3px solid var(--gold);outline-offset:1px}
.searchbox input::-webkit-search-cancel-button{display:none}
.searchbox .clr{position:absolute;right:8px;top:50%;transform:translateY(-50%);border:0;background:#e9edf3;border-radius:50%;width:30px;height:30px;font-size:16px;cursor:pointer;color:var(--navy)}
.hint{margin:8px 2px 0;color:var(--muted);font-size:13px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0 4px;align-items:center}
.chips .lab{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.6px;margin-right:2px}
.chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 12px;font:600 13px inherit;font-family:inherit;cursor:pointer;color:var(--ink)}
.chip[aria-pressed=true]{background:var(--navy);color:#fff;border-color:var(--navy)}
.count{margin:10px 2px;font-size:14px;color:var(--muted)}
.empty{background:#fff;border:1px dashed var(--line);border-radius:12px;padding:28px 16px;text-align:center;color:var(--muted)}
.quick{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-top:14px}

.card{background:var(--card);border:1px solid var(--line);border-radius:12px;margin-bottom:12px;overflow:hidden;border-left:6px solid var(--ok)}
.card.na{border-left-color:var(--bad)}
.card.cond{border-left-color:#d79a00}
.reason.warn{background:var(--warn-bg);color:var(--warn)}
.sn.cd{border-style:dashed}
.card .top{display:flex;gap:12px;padding:12px 14px 8px;align-items:flex-start;justify-content:space-between;flex-wrap:wrap}
.serial{font:700 24px/1 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:var(--navy)}
.nm{font-size:18px;font-weight:700;margin:2px 0}
.sub2{color:var(--muted);font-size:14px}
.badges{display:flex;gap:6px;flex-wrap:wrap}
.badge{display:inline-block;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:700;letter-spacing:.3px}
.b-ok{background:var(--ok-bg);color:var(--ok)}
.b-bad{background:var(--bad-bg);color:var(--bad)}
.b-pres{background:var(--pres-bg);color:var(--pres)}
.b-warn{background:var(--warn-bg);color:var(--warn)}
.b-cat{background:var(--gold-soft);color:#6b5200}
.dir{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:1px;background:var(--line);border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.dir div{background:#f9f8f4;padding:8px 14px}
.dir small{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.7px;color:var(--muted)}
.dir b{font-size:22px;color:var(--navy)}
.dir .loc b{font-size:15px;line-height:1.3;display:block;margin-top:3px}
.reason{margin:0;padding:12px 14px;background:var(--bad-bg);color:var(--bad);font-weight:600}
.reason small{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.7px;opacity:.85}
.reason span{font-size:18px}
.det{padding:4px 14px 6px;display:none}
.det.open{display:block}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:8px 18px;padding:8px 0}
.grid small{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted)}
.grid span{word-break:break-word}
.acts{display:flex;flex-wrap:wrap;gap:8px;padding:10px 14px 14px}
.btn{border:1px solid var(--navy2);background:#fff;color:var(--navy);border-radius:8px;padding:8px 14px;font:600 14px inherit;font-family:inherit;cursor:pointer;text-decoration:none;display:inline-block}
.btn:hover{background:#eef2f8}
.btn.pri{background:var(--ok);border-color:var(--ok);color:#fff}
.btn.pri:hover{background:#12562f}
.btn.undo{background:var(--pres-bg);border-color:var(--pres);color:var(--pres)}
.btn.gold{background:var(--gold);border-color:var(--gold);color:#1d1600}
.btn:focus-visible{outline:3px solid var(--gold);outline-offset:1px}

/* stats */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:16px}
.kpi{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px 16px;border-top:4px solid var(--navy2)}
.kpi small{display:block;color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.7px}
.kpi b{font-size:34px;line-height:1.1;color:var(--navy)}
.kpi em{display:block;font-style:normal;color:var(--muted);font-size:13px}
.kpi.g{border-top-color:var(--ok)} .kpi.b{border-top-color:var(--pres)} .kpi.r{border-top-color:var(--bad)} .kpi.y{border-top-color:var(--gold)}
.panel{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:16px}
.panel h2{margin:0 0 10px;font-size:16px;color:var(--navy)}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px}
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:8px 10px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);background:#faf9f5}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
tr.tot td{font-weight:700;background:#faf9f5;border-top:2px solid var(--navy2)}
.bar{display:inline-block;width:90px;height:9px;background:#e8e4d8;border-radius:5px;vertical-align:middle;overflow:hidden}
.bar i{display:block;height:100%;background:var(--ok)}
.pct{display:inline-block;min-width:44px;text-align:right;margin-left:6px;font-variant-numeric:tabular-nums}
.note{color:var(--muted);font-size:13px;margin:8px 0 0}
.na-row{cursor:pointer}
.na-row:hover td{background:#fff7f6}

/* rooms */
.rooms{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:14px}
.room{background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.room .rh{background:var(--navy);color:#fff;padding:10px 14px;display:flex;justify-content:space-between;align-items:baseline}
.room .rh b{font-size:26px;color:var(--gold-soft)}
.room .rb{padding:12px 14px}
.room .loc{font-weight:600;margin-bottom:6px}
.serials{display:flex;flex-wrap:wrap;gap:4px;margin-top:10px;max-height:150px;overflow:auto;padding:2px}
.sn{border:1px solid var(--line);background:#faf9f5;border-radius:6px;padding:2px 7px;font:600 12px ui-monospace,Menlo,Consolas,monospace;cursor:pointer;color:var(--navy)}
.sn:hover{background:var(--gold-soft)}
.sn.p{background:var(--pres-bg);border-color:var(--pres);color:var(--pres)}

/* sms */
.sms{white-space:pre-wrap;background:#f7f9fc;border:1px solid #cfd9e8;border-left:5px solid var(--navy2);border-radius:10px;padding:16px;font-size:16px;max-width:640px}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--navy);color:#fff;padding:10px 18px;border-radius:999px;font-size:14px;box-shadow:0 4px 14px rgba(0,0,0,.3);opacity:0;pointer-events:none;transition:opacity .2s;z-index:20}
.toast.show{opacity:1}
footer{max-width:1100px;margin:0 auto;padding:6px 16px 28px;color:var(--muted);font-size:12px}
@media (max-width:560px){.hwrap h1{font-size:17px}.when{text-align:left}.serial{font-size:21px}.nm{font-size:17px}}
@media print{nav,.acts,.searchbox,.chips,.toast{display:none}}
</style>
</head>

  }
}
function dirMsg(r){
  return "Final Selection - BAF Shaheen College Dhaka\n" +
    "Candidate: " + r.name + " (Serial " + r.id + ")\n" +
    "Board " + r.board + " | Room " + r.room + "\n" +
    r.bldg + ", " + r.floor + "\n" +
    D.meta.date + ", " + D.meta.time;
}
function pct(a,b){ return b ? Math.round(a*100/b) : 0; }

/* ---------- header ---------- */
$("ttl").textContent = D.meta.title;
$("sub").textContent = D.meta.sub;
$("when").innerHTML = "<b>" + esc(D.meta.date) + "</b><br>Reporting time: <b>" + esc(D.meta.time) + "</b>";
$("foot").textContent = "Data: " + APPROVED.length + " candidates in the Final Selection list + " + NOTAPP.length +
  " others (may attend / not qualified, searchable only). Attendance marks are saved in this browser on this device.";

/* ---------- tabs ---------- */
var tabs = ["search","stats","rooms","sms"];
function showTab(name){
  tabs.forEach(function(t){ $("tab-"+t).hidden = (t!==name); });
  document.querySelectorAll(".tabs button").forEach(function(b){ b.setAttribute("aria-selected", b.dataset.tab===name ? "true":"false"); });
  if (name==="stats") renderStats();
  if (name==="rooms") renderRooms();
  if (name==="search") $("q").focus();
  window.scrollTo(0,0);
}
document.querySelectorAll(".tabs button").forEach(function(b){ b.addEventListener("click", function(){ showTab(b.dataset.tab); }); });

/* ---------- search ---------- */
var fStatus = "all", fCat = "all";
function chipRow(rowId, opts, get, set){
  var row=$(rowId);
  opts.forEach(function(o){
    var b=document.createElement("button"); b.className="chip"; b.type="button"; b.textContent=o[1]; b.dataset.v=o[0];
    b.setAttribute("aria-pressed", get()===o[0] ? "true":"false");
    b.addEventListener("click", function(){ set(o[0]); row.querySelectorAll(".chip").forEach(function(c){ c.setAttribute("aria-pressed", c.dataset.v===get()?"true":"false"); }); runSearch(); });
    row.appendChild(b);
  });
}
chipRow("chipStatus", [["all","All ("+REC.length+")"],["ok","Final Selection list ("+APPROVED.length+")"],["no","Not qualified ("+NOQ.length+")"]], function(){return fStatus;}, function(v){fStatus=v;});
var cats = []; REC.forEach(function(r){ if(cats.indexOf(r.cat)<0) cats.push(r.cat); });
chipRow("chipCat", [["all","All"]].concat(cats.map(function(c){return [c,c];})), function(){return fCat;}, function(v){fCat=v;});

function score(r, q, qd, tokens){
  var s = 0, id = String(r.id);
  if (qd){
    if (id===qd) s=Math.max(s,100);
    else if (id.indexOf(qd)===0) s=Math.max(s,80);
    else if (qd.length>=3 && id.indexOf(qd)>=0) s=Math.max(s,55);
    var m = r.mobile.replace(/\D/g,"");
    if (qd.length>=4 && m.indexOf(qd)>=0) s=Math.max(s, m===qd?100:70);
  }
  if (tokens.length){
    var n=r.name.toLowerCase(), g=r.guardian.toLowerCase(), all=n+" "+g;
    if (tokens.every(function(t){return n.indexOf(t)>=0;})) s=Math.max(s, n.indexOf(tokens[0])===0?60:50);
    else if (tokens.every(function(t){return g.indexOf(t)>=0;})) s=Math.max(s,30);
    else if (tokens.every(function(t){return all.indexOf(t)>=0;})) s=Math.max(s,20);
  }
  return s;
}
function runSearch(){
  var raw = $("q").value.trim();
  $("clr").hidden = !raw;
  var qd = raw.replace(/[\s\-+]/g,"");
  qd = /^\d+$/.test(qd) ? qd : "";
  if (qd.length>11 && qd.indexOf("88")===0) qd = qd.slice(2);
  var tokens = qd ? [] : raw.toLowerCase().split(/\s+/).filter(Boolean);
  var list;
  var filt = function(r){ return (fStatus==="all" || r.st===fStatus) && (fCat==="all" || r.cat===fCat); };
  if (!raw){
    if (fStatus==="all" && fCat==="all"){ renderEmpty(); return; }
    list = REC.filter(filt);
  } else {
    list = REC.filter(filt).map(function(r){ return [score(r,raw,qd,tokens), r]; })
      .filter(function(x){return x[0]>0;})
      .sort(function(a,b){ return b[0]-a[0] || a[1].id-b[1].id; })
      .map(function(x){return x[1];});
  }
  renderList(list);
}
function renderEmpty(){
  $("count").textContent = "";
  var rows = [["Candidates", APPROVED.length, "ok"]];
  $("results").innerHTML = '<div class="empty"><b>Search a candidate</b><br>Type a serial number, mobile number or name above.' +
    '<div class="quick">' +
    '<button class="btn" data-q="ok">Final Selection list: ' + APPROVED.length + '</button>' +
    '<button class="btn" data-q="no">Not qualified: ' + NOQ.length + '</button>' +
    '<button class="btn gold" data-q="pres">Present: ' + Object.keys(att).filter(function(k){return byId[k]&&byId[k].ok;}).length + '</button>' +
    '</div></div>';
  $("results").querySelectorAll("[data-q]").forEach(function(b){ b.addEventListener("click", function(){
    var v=b.dataset.q;
    if (v==="pres"){ showTab("stats"); return; }
    fStatus=v; $("chipStatus").querySelectorAll(".chip").forEach(function(c){ c.setAttribute("aria-pressed", c.dataset.v===fStatus?"true":"false"); });
    runSearch();
  }); });
}
function renderList(list){
  var LIM = 60, shown = list.slice(0,LIM);
  $("count").textContent = list.length + (list.length===1?" result":" results") + (list.length>LIM ? " (showing first "+LIM+" – refine your search)" : "");
  if (!list.length){ $("results").innerHTML = '<div class="empty"><b>No candidate found</b><br>Check the number/spelling. Try fewer characters or only the surname.</div>'; return; }
  var open = list.length<=3;
  $("results").innerHTML = shown.map(function(r){ return cardHTML(r, open); }).join("");
}
function cardHTML(r, open){
  var h = '<article class="card ' + (r.st==="ok"?'':(r.st==="cond"?'cond':'na')) + '" data-id="'+r.id+'">';
  h += '<div class="top"><div><div class="serial">'+r.id+'</div><div class="nm">'+esc(r.name)+'</div>' +
       '<div class="sub2">Guardian: '+esc(r.guardian)+' &nbsp;|&nbsp; '+esc(r.mobile)+'</div></div>' +
       '<div class="badges"><span class="badge b-cat">'+esc(r.cat)+'</span>' +
       (r.st==="ok" ? '<span class="badge b-ok">FINAL SELECTION</span>' : (r.st==="cond" ? '<span class="badge b-warn">MAY ATTEND</span>' : '<span class="badge b-bad">NOT QUALIFIED</span>')) +
       (canSit(r) && isPresent(r.id) ? '<span class="badge b-pres">PRESENT '+hhmm(att[r.id])+'</span>' : '') +
       '</div></div>';
  if (canSit(r)){
    h += '<div class="dir"><div><small>Board</small><b>'+r.board+'</b></div><div><small>Room</small><b>'+esc(r.room)+'</b></div>' +
         '<div class="loc"><small>Building / Floor</small><b>'+esc(r.bldg)+'<br>'+esc(r.floor)+'</b></div></div>';
    if (r.st==="cond") h += '<p class="reason warn"><small>Remarks &ndash; may attend Final Selection; decision will be made later</small><span>'+esc(r.remark||"")+'</span></p>';
  } else {
    h += '<p class="reason"><small>Not qualified for Final Selection &ndash; reason</small><span>'+esc(r.remark||"No reason recorded")+'</span></p>';
  }
  h += '<div class="det'+(open?' open':'')+'"><div class="grid">' +
       f("Date of birth", r.dob) + f("Version", r.ver) + f("Shift", r.shift) + f("Category", r.catName || r.cat);
  Object.keys(r.info||{}).forEach(function(k){ h += f(k, r.info[k]); });
  if (r.st==="ok" && r.remark) h += f("Remarks", r.remark);
  h += '</div></div>';
  h += '<div class="acts">';
  if (canSit(r)){
    h += isPresent(r.id) ? '<button class="btn undo" data-act="undo">Undo present</button>' : '<button class="btn pri" data-act="present">Mark present</button>';
    h += '<button class="btn" data-act="dir">Copy room direction</button>';
  }
  h += '<button class="btn" data-act="sms">Copy SMS text</button>' +
       '<a class="btn" href="tel:'+esc(r.mobile)+'">Call guardian</a>' +
       '<button class="btn" data-act="det">'+(open?'Hide details':'Details')+'</button></div></article>';
  return h;
  function f(k,v){ return v ? '<div><small>'+esc(k)+'</small><span>'+esc(v)+'</span></div>' : ''; }
}
$("results").addEventListener("click", function(e){
  var b = e.target.closest("[data-act]"); if(!b) return;
  var card = b.closest(".card"), r = byId[card.dataset.id], a = b.dataset.act;
  if (a==="present"){ att[r.id] = new Date().toISOString(); saveAtt(); toast(r.name+" marked present"); rerenderCard(card, r); }
  else if (a==="undo"){ delete att[r.id]; saveAtt(); toast("Attendance removed"); rerenderCard(card, r); }
  else if (a==="dir") copy(dirMsg(r), "Room direction copied");
  else if (a==="sms") copy(D.sms, "SMS text copied");
  else if (a==="det"){ var d=card.querySelector(".det"); var o=d.classList.toggle("open"); b.textContent = o?"Hide details":"Details"; }
});
function rerenderCard(card, r){
  var open = card.querySelector(".det").classList.contains("open");
  var tmp = document.createElement("div"); tmp.innerHTML = cardHTML(r, open);
  card.replaceWith(tmp.firstChild);
}
var qEl = $("q"), tm;
qEl.addEventListener("input", function(){ clearTimeout(tm); tm=setTimeout(runSearch, 80); });
qEl.addEventListener("keydown", function(e){ if(e.key==="Escape"){ qEl.value=""; runSearch(); } });
$("clr").addEventListener("click", function(){ qEl.value=""; runSearch(); qEl.focus(); });
document.addEventListener("keydown", function(e){
  if (e.key==="/" && document.activeElement.tagName!=="INPUT"){ e.preventDefault(); showTab("search"); qEl.focus(); }
});

/* ---------- statistics ---------- */
function groupCount(list, keyFn){
  var m = {}; list.forEach(function(r){ var k=keyFn(r); (m[k]=m[k]||{t:0,p:0}); m[k].t++; if(isPresent(r.id)) m[k].p++; }); return m;
}
function barCell(p,t){ var v=pct(p,t); return '<span class="bar" aria-hidden="true"><i style="width:'+v+'%"></i></span><span class="pct">'+v+'%</span>'; }
function simpleTable(title, map, order, firstHead){
  var keys = order || Object.keys(map), tt=0, tp=0;
  var h = '<div class="panel"><h2>'+esc(title)+'</h2><div class="tw"><table><thead><tr><th>'+esc(firstHead)+'</th><th class="n">Total</th><th class="n">Present</th><th class="n">Not yet</th><th>Progress</th></tr></thead><tbody>';
  keys.forEach(function(k){ var x=map[k]||{t:0,p:0}; tt+=x.t; tp+=x.p;
    h += '<tr><td>'+esc(k)+'</td><td class="n">'+x.t+'</td><td class="n">'+x.p+'</td><td class="n">'+(x.t-x.p)+'</td><td>'+barCell(x.p,x.t)+'</td></tr>'; });
  h += '<tr class="tot"><td>Total</td><td class="n">'+tt+'</td><td class="n">'+tp+'</td><td class="n">'+(tt-tp)+'</td><td>'+barCell(tp,tt)+'</td></tr></tbody></table></div></div>';
  return h;
}
function renderStats(){
  var total = APPROVED.length, present = APPROVED.filter(function(r){return isPresent(r.id);}).length;
  var h = '<div class="kpis">' +
    kpi("Total candidates", total, "Final Selection list", "y") +
    kpi("Present", present, pct(present,total)+"% attended", "g") +
    kpi("Not yet arrived", total-present, "of "+total+" candidates", "b") +
    kpi("Not qualified", NOQ.length, "cannot sit &middot; search only", "r") +
    '</div>';

  /* board / room */
  var br = {}; APPROVED.forEach(function(r){ var k=r.ver+"|"+r.board; (br[k]=br[k]||{r:r,t:0,p:0,c:{}}); br[k].t++; if(isPresent(r.id)) br[k].p++; br[k].c[r.cat]=(br[k].c[r.cat]||0)+1; });
  var keys = Object.keys(br).sort(function(a,b){ var x=br[a].r,y=br[b].r; return (x.ver===y.ver?0:(x.ver==="Bangla"?-1:1)) || x.board-y.board; });
  var tt=0,tp=0;
  h += '<div class="panel"><h2>Board &amp; room wise</h2><div class="tw"><table><thead><tr><th>Version</th><th class="n">Board</th><th class="n">Room</th><th>Building / Floor</th><th>Category</th><th class="n">Total</th><th class="n">Present</th><th class="n">Not yet</th><th>Progress</th></tr></thead><tbody>';
  keys.forEach(function(k){ var x=br[k], r=x.r; tt+=x.t; tp+=x.p;
    var cs = Object.keys(x.c).map(function(c){return c+" "+x.c[c];}).join(", ");
    h += '<tr><td>'+esc(r.ver)+'</td><td class="n">'+r.board+'</td><td class="n"><b>'+esc(r.room)+'</b></td><td>'+esc(r.bldg)+', '+esc(r.floor)+'</td><td>'+esc(cs)+'</td><td class="n">'+x.t+'</td><td class="n">'+x.p+'</td><td class="n">'+(x.t-x.p)+'</td><td>'+barCell(x.p,x.t)+'</td></tr>'; });
  h += '<tr class="tot"><td colspan="5">Total</td><td class="n">'+tt+'</td><td class="n">'+tp+'</td><td class="n">'+(tt-tp)+'</td><td>'+barCell(tp,tt)+'</td></tr></tbody></table></div></div>';

  h += '<div class="cols">' +
    simpleTable("Category wise", groupCount(APPROVED,function(r){return r.cat;}), ["BAF","SD/ SEMC","GEN"].filter(function(c){return APPROVED.some(function(r){return r.cat===c;});}), "Category") +
    simpleTable("Version wise", groupCount(APPROVED,function(r){return r.ver;}), ["Bangla","English"], "Version") +
    simpleTable("Shift wise", groupCount(APPROVED,function(r){return r.shift;}), ["Morning","Day"], "Shift") +
    '</div>';

  /* category x version */
  var cv = groupCount(APPROVED,function(r){return r.cat+" – "+r.ver;});
  h += simpleTable("Category × version", cv, Object.keys(cv).sort(), "Category – Version");

  /* conditional */
  if (COND.length) { h += '<div class="panel"><h2>May attend &ndash; see remarks ('+COND.length+')</h2><div class="tw"><table><thead><tr><th class="n">Serial</th><th>Candidate</th><th>Category</th><th class="n">Board</th><th class="n">Room</th><th>Remarks</th><th>Attendance</th></tr></thead><tbody>';
  COND.forEach(function(r){ h += '<tr class="na-row" data-id="'+r.id+'"><td class="n"><b>'+r.id+'</b></td><td>'+esc(r.name)+'</td><td>'+esc(r.cat)+'</td><td class="n">'+r.board+'</td><td class="n"><b>'+esc(r.room)+'</b></td><td><span class="badge b-warn">'+esc(r.remark)+'</span></td><td>'+(isPresent(r.id)?'<span class="badge b-pres">PRESENT '+hhmm(att[r.id])+'</span>':'Not yet')+'</td></tr>'; });
  h += '</tbody></table></div><p class="note">These candidates may sit for Final Selection; the decision is made later. They are not counted in the totals above. Tap a row to open.</p></div>'; }
  /* not qualified */
  var rs = {}; NOQ.forEach(function(r){ var k=r.remark||"No reason recorded"; rs[k]=(rs[k]||0)+1; });
  h += '<div class="panel"><h2>Not qualified for Final Selection ('+NOQ.length+')</h2><div class="tw"><table><thead><tr><th class="n">Serial</th><th>Candidate</th><th>Category</th><th>Mobile</th><th>Reason</th></tr></thead><tbody>';
  NOQ.forEach(function(r){ h += '<tr class="na-row" data-id="'+r.id+'"><td class="n"><b>'+r.id+'</b></td><td>'+esc(r.name)+'</td><td>'+esc(r.cat)+'</td><td>'+esc(r.mobile)+'</td><td><span class="badge b-bad">'+esc(r.remark||"No reason recorded")+'</span></td></tr>'; });
  h += '</tbody></table></div><p class="note">By reason: ' + Object.keys(rs).map(function(k){return esc(k)+" – "+rs[k];}).join(" &nbsp;|&nbsp; ") + '. Tap a row to open the candidate.</p></div>';

  h += '<div class="panel"><h2>Attendance</h2><div class="acts" style="padding:0"><button class="btn gold" id="dl">Download attendance (CSV)</button><button class="btn" id="rst">Reset all attendance</button></div><p class="note">Present counts update when you press “Mark present” on a candidate’s card. Marks stay in this browser even if you close the page.</p></div>';
  $("tab-stats").innerHTML = h;
  $("dl").addEventListener("click", downloadCSV);
  $("rst").addEventListener("click", function(){ if (confirm("Remove ALL attendance marks? This cannot be undone.")){ att={}; saveAtt(); renderStats(); toast("Attendance reset"); } });
  $("tab-stats").querySelectorAll(".na-row").forEach(function(tr){ tr.addEventListener("click", function(){ openCandidate(tr.dataset.id); }); });
  function kpi(l,v,s,c){ return '<div class="kpi '+c+'"><small>'+l+'</small><b>'+v+'</b><em>'+s+'</em></div>'; }
}
function csvCell(v){ v=String(v==null?"":v); return /[",\n]/.test(v) ? '"'+v.replace(/"/g,'""')+'"' : v; }
function downloadCSV(){
  var rows = [["Serial","Name","Guardian","Category","Mobile","Version","Board","Room","Status","Present time"]];
  rows[0].splice(8,0,"List");
  APPROVED.concat(COND).forEach(function(r){ rows.push([r.id,r.name,r.guardian,r.cat,"'"+r.mobile,r.ver,r.board,r.room,r.st==="ok"?"Final Selection list":"May attend",isPresent(r.id)?"Present":"Not yet",isPresent(r.id)?new Date(att[r.id]).toLocaleString():""]); });
  var csv = "﻿" + rows.map(function(r){return r.map(csvCell).join(",");}).join("\r\n");
  var a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([csv],{type:"text/csv;charset=utf-8"}));
  a.download = "attendance_final_selection_2027.csv"; document.body.appendChild(a); a.click();
  setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); }, 500);
}
function openCandidate(id){ showTab("search"); qEl.value = String(id); runSearch(); }

/* ---------- rooms ---------- */
function renderRooms(){
  var order = D.rooms.slice().sort(function(a,b){ return (a.ver===b.ver?0:(a.ver==="Bangla"?-1:1)) || a.board-b.board; });
  var h = '<p class="count">'+order.length+' rooms. Tap a serial number to open that candidate.</p><div class="rooms">';
  order.forEach(function(x){
    var mem = APPROVED.filter(function(r){return r.ver===x.ver && r.board===x.board;}).sort(function(a,b){return a.id-b.id;});
    var cd = COND.filter(function(r){return r.ver===x.ver && r.board===x.board;}).sort(function(a,b){return a.id-b.id;});
    var c = {}; mem.forEach(function(r){ c[r.cat]=(c[r.cat]||0)+1; });
    var p = mem.filter(function(r){return isPresent(r.id);}).length;
    h += '<div class="room"><div class="rh"><span>Board '+x.board+' &middot; '+esc(x.ver)+' version</span><b>'+esc(x.room)+'</b></div><div class="rb">' +
      '<div class="loc">'+esc(x.bldg)+' &mdash; '+esc(x.floor)+'</div>' +
      '<div>'+Object.keys(c).map(function(k){return '<span class="badge b-cat">'+esc(k)+': '+c[k]+'</span>';}).join(" ")+' <span class="badge b-ok">Total: '+mem.length+'</span> <span class="badge b-pres">Present: '+p+'</span></div>' +
      '<div class="serials">'+mem.map(function(r){return '<button class="sn'+(isPresent(r.id)?' p':'')+'" data-id="'+r.id+'" title="'+esc(r.name)+'">'+r.id+'</button>';}).join("")+'</div>' +
      (cd.length ? '<div class="note">May attend (see remarks):</div><div class="serials">'+cd.map(function(r){return '<button class="sn cd'+(isPresent(r.id)?' p':'')+'" data-id="'+r.id+'" title="'+esc(r.name)+'">'+r.id+'</button>';}).join("")+'</div>' : '') + '</div></div>';
  });
  h += '</div>';
  $("tab-rooms").innerHTML = h;
  $("tab-rooms").querySelectorAll(".sn").forEach(function(b){ b.addEventListener("click", function(){ openCandidate(b.dataset.id); }); });
}

/* ---------- sms ---------- */
$("tab-sms").innerHTML = '<div class="panel"><h2>SMS sent to guardians</h2><div class="sms" id="smsText"></div>' +
  '<div class="acts" style="padding:12px 0 0"><button class="btn gold" id="smsCopy">Copy SMS text</button></div></div>';
$("smsText").textContent = D.sms;
$("smsCopy").addEventListener("click", function(){ copy(D.sms, "SMS text copied"); });

runSearch();
qEl.focus();
})();
</script>
