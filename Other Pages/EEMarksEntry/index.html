<style>
/* Layout: sticky top bar + file tabs, one scrolling view, fixed bottom nav. Big thumb targets. */
:root{--bg:#f3f5f8;--sf:#fff;--sf2:#e8ecf2;--fg:#0f1722;--mu:#566274;--ln:#cdd5e0;--ac:#1e4fd8;--acf:#fff;
--ok:#12803a;--okb:#d8f3e2;--bad:#c4281c;--badb:#fde2df;--wn:#8a5a00;--wnb:#fff0c9;--ab:#7a3fb0;--abb:#eadcf7;
--ui:system-ui,-apple-system,"Segoe UI","Noto Sans Bengali","Kalpurush","SolaimanLipi",Roboto,sans-serif;--r:12px}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0c1118;--sf:#161d28;--sf2:#212b3a;--fg:#eef2f8;--mu:#9aa7ba;--ln:#334156;--ac:#7ea3ff;--acf:#07122e;
--ok:#4fd883;--okb:#12341f;--bad:#ff7b6e;--badb:#3d1713;--wn:#f5c451;--wnb:#3a2d0a;--ab:#c99bf2;--abb:#2e1c40;color-scheme:dark}}
:root[data-theme=dark]{--bg:#0c1118;--sf:#161d28;--sf2:#212b3a;--fg:#eef2f8;--mu:#9aa7ba;--ln:#334156;--ac:#7ea3ff;--acf:#07122e;
--ok:#4fd883;--okb:#12341f;--bad:#ff7b6e;--badb:#3d1713;--wn:#f5c451;--wnb:#3a2d0a;--ab:#c99bf2;--abb:#2e1c40;color-scheme:dark}
*{box-sizing:border-box}body{background:var(--bg);color:var(--fg);font-family:var(--ui);font-size:16px;margin:0;padding-bottom:84px;
padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--sf);z-index:30}
button,input,select,textarea{font:inherit;color:inherit}
button{background:var(--sf2);border:1px solid var(--ln);border-radius:var(--r);padding:12px 14px;min-height:48px;cursor:pointer;font-weight:600}
button:active{transform:scale(.97)}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--ac);outline-offset:1px}
button.pri{background:var(--ac);color:var(--acf);border-color:var(--ac)}button.bad{background:var(--bad);color:#fff;border-color:var(--bad)}
button.sm{min-height:36px;padding:6px 10px;font-size:14px}
input,select,textarea{background:var(--sf);border:2px solid var(--ln);border-radius:var(--r);padding:10px 12px;min-height:46px;width:100%}
label{display:block;font-size:13px;color:var(--mu);margin:10px 0 4px;font-weight:600}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--sf);margin:0 calc(-1*max(12px,env(safe-area-inset-left,0px)));padding:6px 12px;display:flex;align-items:center;gap:8px;border-bottom:1px solid var(--ln)}
header h1{font-size:17px;margin:0;flex:1}header button{min-height:38px;padding:4px 10px}
#saved{font-size:12px;font-weight:700;color:var(--ok);min-width:64px;text-align:right}#saved.err{color:var(--bad)}
#tabs{display:flex;gap:6px;overflow-x:auto;padding:8px 0;scrollbar-width:thin}
#tabs button{white-space:nowrap;min-height:40px;padding:6px 12px;flex:none;max-width:60vw;overflow:hidden;text-overflow:ellipsis}
#tabs button.on{background:var(--ac);color:var(--acf);border-color:var(--ac)}
.card{background:var(--sf);border:1px solid var(--ln);border-radius:var(--r);padding:12px;margin:8px 0}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.row>*{min-width:0}.grow{flex:1}
.mu{color:var(--mu);font-size:13px}.stats{display:flex;gap:6px}.stats div{flex:1;background:var(--sf);border:1px solid var(--ln);border-radius:10px;padding:6px;text-align:center;font-size:12px;color:var(--mu)}
.stats b{display:block;font-size:19px;color:var(--fg);font-variant-numeric:tabular-nums}
.bar{height:12px;background:var(--sf2);border-radius:9px;overflow:hidden;margin:6px 0}.bar i{display:block;height:100%;background:var(--ac);width:0;transition:width .2s}
.bar.full i{background:var(--ok)}.bar.over i{background:var(--bad)}
#roll{font-size:clamp(44px,16vw,84px);font-weight:800;text-align:center;font-variant-numeric:tabular-nums;letter-spacing:1px;line-height:1.1;margin:4px 0}
#rname{text-align:center;min-height:20px}#old{text-align:center;min-height:26px;font-weight:700}
#marks{font-size:clamp(40px,14vw,68px);font-weight:800;text-align:center;min-height:84px;border-color:var(--ac);font-variant-numeric:tabular-nums}
#marks.ok{border-color:var(--ok);background:var(--okb)}#marks.er{border-color:var(--bad);background:var(--badb)}
.act{display:grid;grid-template-columns:1fr 1.7fr;gap:8px;margin-top:8px}.act button{min-height:60px;font-size:19px}
.warn{background:var(--wnb);color:var(--wn);border:2px solid var(--wn);border-radius:var(--r);padding:10px;margin:8px 0;font-weight:600}
.warn.er{background:var(--badb);color:var(--bad);border-color:var(--bad)}
#sug{display:flex;flex-direction:column;gap:4px;margin-top:4px}#sug button{text-align:left;min-height:40px}
#grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(58px,1fr));gap:4px;max-height:230px;overflow-y:auto;padding:2px}
#grid button{min-height:34px;padding:2px;font-size:12.5px;border-radius:7px;font-variant-numeric:tabular-nums;background:var(--sf2)}
#grid .d{background:var(--okb);color:var(--ok);border-color:var(--ok)}#grid .a{background:var(--abb);color:var(--ab);border-color:var(--ab)}
#grid .c{background:var(--ac);color:var(--acf);border-color:var(--ac);outline:2px solid var(--fg)}#grid .hid{display:none}
.chips button{min-height:34px;padding:4px 10px;font-size:13px}.chips button.on{background:var(--fg);color:var(--bg)}
nav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--sf);border-top:1px solid var(--ln);display:flex;padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px));gap:4px}
nav button{flex:1;min-height:50px;padding:4px;font-size:13px;border:0;background:transparent;color:var(--mu)}nav button.on{color:var(--ac);background:var(--sf2)}
footer{text-align:center;font-size:10px;opacity:.4;padding:14px 0 4px}
table{border-collapse:collapse;width:100%;font-size:13px;font-variant-numeric:tabular-nums}td,th{border-bottom:1px solid var(--ln);padding:5px 6px;text-align:left}.sc{overflow-x:auto}
.pos{color:var(--ok);font-weight:700}.neg{color:var(--bad);font-weight:700}
#modal{position:fixed;inset:0;background:#0009;z-index:50;display:flex;align-items:flex-end;justify-content:center}#modal[hidden]{display:none}
#mbox{background:var(--sf);border-radius:18px 18px 0 0;padding:16px max(16px,env(safe-area-inset-left,0px)) calc(16px + env(safe-area-inset-bottom,0px));width:100%;max-width:560px;max-height:88%;overflow:auto}
#mbox .row{margin-top:12px}#mbox .row button{flex:1}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:96px;background:var(--fg);color:var(--bg);padding:8px 14px;border-radius:20px;z-index:60;font-size:14px;max-width:90%}
.tg{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 0}.tg input{width:26px;min-height:26px}
html,body{min-height:100dvh}
.mrow{display:flex;flex-wrap:nowrap;gap:8px;align-items:stretch}.mrow #marks{flex:1 1 auto;min-width:0;width:auto}
#bMic{flex:none;width:64px;min-height:84px;font-size:26px;padding:0}#bMic.rec{background:var(--bad);color:#fff;animation:pl 1s infinite}@keyframes pl{50%{opacity:.6}}
#marks[data-abs]{border-color:var(--ab);background:var(--abb)}#marks[data-abs]::placeholder{color:var(--ab);opacity:1;font-weight:800;letter-spacing:2px}
.badge{display:inline-block;background:var(--ab);color:var(--bg);border-radius:8px;padding:2px 10px;font-weight:800;letter-spacing:1px}
#kp{display:none;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:8px}.kp #kp{display:grid}.kp .act{display:none}
#kp button{min-height:62px;font-size:26px;padding:4px}#kp [data-k=next]{grid-column:span 2}#kp [data-k=prev]{font-size:18px}
.kb nav,.kb footer{display:none}.kb{padding-bottom:8px}
</style>
</head>
<body>
<header><h1>খাতা Entry</h1><span id="saved">Saved ✓</span><button id="bWake" title="Keep screen awake">☀</button><button id="bFs" hidden title="Full screen">⛶</button><button id="bTheme" title="Theme">◐</button></header>
<div id="tabs"></div><div id="hint" class="warn" hidden></div>
<main>
<section id="v-entry">
 <div id="bstrip" class="card"></div>
 <div class="stats" id="stats"></div>
 <div class="card" style="position:relative">
  <input id="q" type="text" inputmode="decimal" placeholder="🔍 Jump to roll or search…">
  <div id="sug"></div>
 </div>
 <div class="card">
  <div id="roll">—</div><div id="rname" class="mu"></div><div id="old"></div>
  <div class="mrow" id="mrow"><input id="marks" inputmode="decimal" placeholder="Marks"><button id="bMic" hidden title="Voice">🎤</button></div><div id="vst" class="mu" hidden></div>
  <div id="warn" hidden></div><div id="kp"></div>
  <div class="act"><button id="bPrev">◀ Prev</button><button id="bNext" class="pri">Save &amp; Next ▶</button></div>
  <div class="row" style="margin-top:8px"><button id="bUndo" class="sm grow">↶ Undo last</button></div>
 </div>
 <div class="card"><div class="row chips" id="gf"></div><div id="grid"></div></div>
</section>
<section id="v-bundle" hidden></section>
<section id="v-report" hidden></section>
<section id="v-settings" hidden></section>
<section id="v-empty" hidden></section>
</main>
<footer>Made by Kowshik Shikder - Kowshik.bafsd@gmail.com</footer>
<nav id="nav"><button data-v="entry">✏️<br>Entry</button><button data-v="bundle">📦<br>Bundle</button><button data-v="report">📋<br>Reports</button><button data-v="settings">⚙️<br>Settings</button></nav>
<div id="modal" hidden><div id="mbox"></div></div>
<input type="file" id="fi" accept=".xlsx,.xls" multiple hidden>
<input type="file" id="fr" accept=".json" hidden>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script>
'use strict';
/* ===== helpers ===== */
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const bn=s=>String(s??'').replace(/[০-৯]/g,d=>'০১২৩৪৫৬৭৮৯'.indexOf(d));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const parseMarks=s=>{s=bn(s).trim().replace(',','.');return /^\d+(\.\d+)?$/.test(s)?parseFloat(s):NaN};
const disp=m=>m==null?'—':m==='A'?'Absent':m;
const colL=n=>{let s='';for(n++;n>0;n=((n-1)/26)|0)s=String.fromCharCode(65+(n-1)%26)+s;return s};
const colN=s=>[...s].reduce((a,c)=>a*26+c.charCodeAt(0)-64,0)-1;
const ls={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
let prefs=Object.assign({vib:true,snd:true,theme:'auto',wake:false,vlang:'bn-BD',vauto:false,keypad:true},ls.get('prefs',{}));
const savePrefs=()=>ls.set('prefs',prefs);
if(!prefs.v2){prefs.vlang='bn-BD';prefs.v2=1;savePrefs()}
let toastT;function toast(m){let t=$('#toast');if(!t){t=document.createElement('div');t.id='toast';document.body.appendChild(t)}t.textContent=m;t.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>t.hidden=true,2200)}
let AC;const ac=()=>{try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume()}catch(e){}return AC};
const canVib='vibrate' in navigator;
document.addEventListener('pointerdown',ac,{passive:true});/* unlock audio on first tap */
function beep(ok){if(prefs.vib&&canVib)try{navigator.vibrate(ok?40:[200,100,200])}catch(e){}
 if(!prefs.snd)return;try{const c=ac(),t=(f,s,d)=>{const o=c.createOscillator(),g=c.createGain();o.frequency.value=f;g.gain.value=.12;o.connect(g);g.connect(c.destination);o.start(c.currentTime+s);o.stop(c.currentTime+s+d)};ok?t(880,0,.08):(t(200,0,.18),t(140,.26,.24))}catch(e){}}
function dl(blob,name){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{a.remove();URL.revokeObjectURL(a.href)},3000)}
const fmt=t=>new Date(t).toLocaleString([], {day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit',second:'2-digit'});

/* ===== IndexedDB: 'meta' (file state, saved after every entry) + 'bufs' (original Excel bytes) ===== */
let db,pending=0;
const idb=()=>new Promise((res,rej)=>{if(db)return res(db);const q=indexedDB.open('khata-entry',1);
 q.onupgradeneeded=()=>{q.result.createObjectStore('meta',{keyPath:'id'});q.result.createObjectStore('bufs')};
 q.onsuccess=()=>res(db=q.result);q.onerror=()=>rej(q.error)});
async function tx(store,mode,fn){try{const d=await idb();return await new Promise((res,rej)=>{const t=d.transaction(store,mode);const r=fn(t.objectStore(store));t.oncomplete=()=>res(r?r.result:null);t.onerror=t.onabort=()=>rej(t.error)})}catch(e){console.error(e);return undefined}}
function setSaved(ok){const s=$('#saved');s.textContent=ok?'Saved ✓':'Save failed!';s.className=ok?'':'err'}
async function save(f){pending++;$('#saved').textContent='Saving…';const r=await tx('meta','readwrite',s=>s.put(f));pending--;if(!pending)setSaved(r!==undefined)}
const saveBuf=(id,b)=>tx('bufs','readwrite',s=>s.put(b,id));
/* ===== state ===== */
const S={files:[],cur:null,view:'entry'},BUF={},IDX={};
const F=()=>S.files.find(f=>f.id===S.cur);
const absRe=f=>new RegExp('^('+((f.set.absent??'')?(f.set.absent).replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'|':'')+'a|ab|abs|absent|অনুপস্থিত)$','i');
function reindex(f){const m=new Map();f.rows.forEach((r,i)=>{if(!m.has(r.k))m.set(r.k,i)});IDX[f.id]=m}
function stats(f){let e=0,a=0,p=0;for(const r of f.rows){if(r.m==null)p++;else if(r.m==='A')a++;else e++}return{e,a,p,t:f.rows.length}}
const status=r=>r.m==null?'p':r.m==='A'?'a':'d';

/* ===== Excel parsing ===== */
function sheetAoa(wb,name){const ws=wb.Sheets[name];const r0=ws['!ref']?XLSX.utils.decode_range(ws['!ref']).s.r:0;
 return{aoa:XLSX.utils.sheet_to_json(ws,{header:1,raw:true,defval:null,blankrows:true}),r0}}
function guessHeader(aoa){let best=0,sc=-1;aoa.slice(0,40).forEach((row,i)=>{const t=row.filter(c=>typeof c==='string'&&c.trim()).length;
 const s=t+(row.some(c=>/roll/i.test(c))?50:0)+(row.some(c=>/mark/i.test(c))?20:0);if(t>=2&&s>sc){sc=s;best=i}});return best}
function guessCols(h,old){const f=re=>h.findIndex(c=>re.test(String(c??'')));
 return{roll:old?.roll??f(/roll|রোল/i),marks:old?.marks??f(/mark|নম্বর/i),name:old?.name??f(/^(?!.*post).*(name|নাম)/i)}}
function buildRows(aoa,r0,hdr,map,f){const out=[],re=absRe(f);
 for(let i=hdr+1;i<aoa.length;i++){const row=aoa[i]||[],k=row[map.roll];if(k==null||String(k).trim()==='')continue;
  let m=map.marks>=0?row[map.marks]:null;if(m==null||String(m).trim()==='')m=null;else if(typeof m==='string'){const t=m.trim();m=re.test(t)?'A':isNaN(parseMarks(t))?null:parseMarks(t)}
  out.push({r:i+r0+1,k:String(k).trim(),n:map.name>=0&&row[map.name]!=null?String(row[map.name]):'',m,o:m})}
 return out}
/* Modal helpers */
function modal(html,wire){return new Promise(res=>{const b=$('#mbox');b.innerHTML=html;$('#modal').hidden=false;
 const close=v=>{$('#modal').hidden=true;res(v)};b.querySelectorAll('[data-r]').forEach(x=>x.onclick=()=>close(x.dataset.r==='1'));if(wire)wire(b,close)})}
const ask=(msg,ok='OK',no='Cancel',bad)=>modal(`<div>${msg}</div><div class="row"><button data-r="0">${no}</button><button data-r="1" class="${bad?'bad':'pri'}">${ok}</button></div>`);
async function danger(msg){return await ask(msg,'Continue','Cancel',true)&&await ask('<b>Final check.</b> This cannot be undone easily.<br>'+msg,'Yes, do it','Go back',true)}
/* Column picker: sheet, header row, Roll / Marks / Name */
function pickColumns(wb,sheet,init){return new Promise(res=>{let sh=sheet,{aoa,r0}=sheetAoa(wb,sh),hdr=init?.hdr??guessHeader(aoa),map=init?.map;
 const draw=()=>{const h=aoa[hdr]||[],n=Math.max(h.length,...aoa.slice(hdr+1,hdr+4).map(r=>r.length),1);map=guessCols(h,map);
  const opts=(sel,opt)=>`<select data-c="${sel}">${opt?'<option value="-1">(none)</option>':''}${Array.from({length:n},(_,i)=>`<option value="${i}" ${map[sel]===i?'selected':''}>${colL(i)} — ${esc(h[i]??'')}</option>`).join('')}</select>`;
  const smp=aoa.slice(hdr+1,hdr+4).map(r=>'<tr>'+Array.from({length:Math.min(n,8)},(_,i)=>`<td>${esc(r[i]??'')}</td>`).join('')+'</tr>').join('');
  $('#mbox').innerHTML=`<h3 style="margin:0">Choose columns</h3>
  <label>Sheet</label><select id="pS">${wb.SheetNames.map(s=>`<option ${s===sh?'selected':''}>${esc(s)}</option>`).join('')}</select>
  <label>Header row number (auto-detected)</label><input id="pH" type="number" min="1" value="${hdr+r0+1}">
  <label>Roll column</label>${opts('roll')}<label>Marks column</label>${opts('marks')}<label>Name column (optional)</label>${opts('name',1)}
  <div class="sc mu" style="margin-top:8px"><table>${smp}</table></div>
  <div class="row"><button data-x="0">Cancel</button><button data-x="1" class="pri">Use these</button></div>`;
  $('#pS').onchange=e=>{sh=e.target.value;({aoa,r0}=sheetAoa(wb,sh));hdr=guessHeader(aoa);map=undefined;draw()};
  $('#pH').onchange=e=>{hdr=Math.max(0,+e.target.value-r0-1);map=undefined;draw()};
  $$('#mbox select[data-c]').forEach(s=>s.onchange=()=>map[s.dataset.c]=+s.value);
  $$('#mbox [data-x]').forEach(b=>b.onclick=()=>{$('#modal').hidden=true;res(b.dataset.x==='1'?{sheet:sh,hdr,r0,aoa,map}:null)})};
 $('#modal').hidden=false;draw()})}
/* ===== files: upload, switch, delete ===== */
async function addFile(file){try{const buf=await file.arrayBuffer();const wb=XLSX.read(buf,{type:'array'});
 const saved=ls.get('maps',{})[file.name];const sheet=saved?.sheet&&wb.SheetNames.includes(saved.sheet)?saved.sheet:wb.SheetNames[0];
 const p=await pickColumns(wb,sheet,saved);if(!p)return;
 const f={id:uid(),name:file.name,sheet:p.sheet,hdr:p.hdr+p.r0+1,map:p.map,set:{max:100,absent:'',skipAbs:true},rows:[],pos:0,bundle:null,bundles:[],log:[],created:Date.now()};
 f.rows=buildRows(p.aoa,p.r0,p.hdr,p.map,f);if(!f.rows.length){toast('No rows found. Check the roll column.');return}
 const mk=ls.get('maps',{});mk[file.name]={sheet:p.sheet,hdr:p.hdr,map:p.map};ls.set('maps',mk);
 BUF[f.id]=buf;await saveBuf(f.id,buf);S.files.push(f);reindex(f);await save(f);switchFile(f.id);toast(f.rows.length+' rolls loaded')}
 catch(e){console.error(e);toast('Could not read this file')}}
function switchFile(id){S.cur=id;ls.set('cur',id);gridBuilt=null;S.view='entry';render()}
async function remap(f){const wb=XLSX.read(BUF[f.id],{type:'array'});const p=await pickColumns(wb,f.sheet,{hdr:f.hdr-1,map:f.map});if(!p)return;
 if(!await ask('Re-read the file with new columns? Marks you entered here are kept (matched by roll).','Re-read','Cancel'))return;
 const keep={};f.rows.forEach(r=>{if(r.m!==r.o)keep[r.k]=r.m});f.sheet=p.sheet;f.hdr=p.hdr+p.r0+1;f.map=p.map;f.rows=buildRows(p.aoa,p.r0,p.hdr,p.map,f);
 f.rows.forEach(r=>{if(r.k in keep)r.m=keep[r.k]});f.pos=0;reindex(f);gridBuilt=null;await save(f);render()}

 gridBuilt=null;if(!S.cur)S.cur=S.files[0]?.id;render();toast('Restored '+o.files.length+' file(s)')}catch(e){console.error(e);toast('Not a valid backup file')}}
/* ===== wake lock, theme, voice ===== */
let wl;async function wake(){try{if(prefs.wake&&'wakeLock' in navigator&&document.visibilityState==='visible')wl=await navigator.wakeLock.request('screen');else if(wl){await wl.release();wl=null}}catch(e){}$('#bWake').style.opacity=prefs.wake?1:.45}
const applyTheme=()=>{const r=document.documentElement;prefs.theme==='auto'?r.removeAttribute('data-theme'):r.setAttribute('data-theme',prefs.theme)};
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
/* ===== voice: Web Speech API, Bangla + English number words ===== */
const inFrame=(()=>{try{return window.self!==window.top}catch(e){return true}})();
const nb=x=>x.replace(/[ঁ়]/g,'').replace(/ঊ/g,'উ');
const BNW='শূন্য এক দুই তিন চার পাঁচ ছয় সাত আট নয় দশ এগারো বারো তেরো চৌদ্দ পনেরো ষোলো সতেরো আঠারো উনিশ বিশ একুশ বাইশ তেইশ চব্বিশ পঁচিশ ছাব্বিশ সাতাশ আঠাশ ঊনত্রিশ ত্রিশ একত্রিশ বত্রিশ তেত্রিশ চৌত্রিশ পঁয়ত্রিশ ছত্রিশ সাঁইত্রিশ আটত্রিশ ঊনচল্লিশ চল্লিশ একচল্লিশ বিয়াল্লিশ তেতাল্লিশ চুয়াল্লিশ পঁয়তাল্লিশ ছেচল্লিশ সাতচল্লিশ আটচল্লিশ ঊনপঞ্চাশ পঞ্চাশ একান্ন বায়ান্ন তিপ্পান্ন চুয়ান্ন পঞ্চান্ন ছাপ্পান্ন সাতান্ন আটান্ন ঊনষাট ষাট একষট্টি বাষট্টি তেষট্টি চৌষট্টি পঁয়ষট্টি ছিষট্টি সাতষট্টি আটষট্টি ঊনসত্তর সত্তর একাত্তর বাহাত্তর তিয়াত্তর চুয়াত্তর পঁচাত্তর ছিয়াত্তর সাতাত্তর আটাত্তর ঊনআশি আশি একাশি বিরাশি তিরাশি চুরাশি পঁচাশি ছিয়াশি সাতাশি আটাশি ঊননব্বই নব্বই একানব্বই বিরানব্বই তিরানব্বই চুরানব্বই পঁচানব্বই ছিয়ানব্বই সাতানব্বই আটানব্বই নিরানব্বই'.split(' ');
const NUMW={};BNW.forEach((w,i)=>NUMW[nb(w)]=i);
Object.entries({এগার:11,বার:12,তের:13,পনের:15,ষোল:16,সতের:17,আঠার:18,ছ:6,একশ:100,একশো:100,একশত:100,zero:0,one:1,two:2,three:3,four:4,five:5,six:6,seven:7,eight:8,nine:9,ten:10,eleven:11,twelve:12,thirteen:13,fourteen:14,fifteen:15,sixteen:16,seventeen:17,eighteen:18,nineteen:19,twenty:20,thirty:30,forty:40,fifty:50,sixty:60,seventy:70,eighty:80,ninety:90}).forEach(([k,v])=>NUMW[nb(k)]=v);
const HUND=new Set(['hundred','শ','শো','শত']);
function wordsToNum(t){t=bn(t).toLowerCase().replace(/[-,।]/g,' ').replace(/\b(point|dot)\b|দশমিক/g,' . ');
 const m=t.match(/\d+(\s*\.\s*\d+)?/);if(m)return parseFloat(m[0].replace(/\s/g,''));
 let cur=0,fp='',dec=false,any=false;
 for(const w0 of t.split(/\s+/).filter(Boolean)){const w=nb(w0);if(w==='.'){dec=true;continue}
  let v=NUMW[w];if(v==null&&HUND.has(w))v='H';
  if(v==null){const h=w.match(/^(.+?)(শো|শত|শ)$/);if(h&&NUMW[h[1]]>=1&&NUMW[h[1]]<=9)v=NUMW[h[1]]*100}
  if(v==null)continue;any=true;if(dec){fp+=v;continue}
  if(v==='H')cur=(cur||1)*100;else cur+=v}
 return any?parseFloat(cur+(fp?'.'+fp:'')):null}
const MIC_ERR={'not-allowed':'Microphone permission denied. Tap the lock icon in the address bar, set Microphone to Allow, then tap 🎤 again.','service-not-allowed':'Speech service is blocked. Use Chrome in a normal tab over HTTPS and turn on speech/voice typing in system settings.','no-speech':'No speech heard for about 8 seconds. Move closer to the mic and tap 🎤 again.','audio-capture':'No working microphone found or another app is using it. Close other apps and check the mic.','network':'Voice needs internet (Chrome sends audio to Google). Check your connection and try again.','language-not-supported':'This language is not supported here. Switch the voice language in Settings.'};
let rec=null,recT=null,micOn=false,micStop=true;
const say=t=>{const v=$('#vst');v.hidden=!t;v.textContent=t||''};
function micUi(on){micOn=on;$('#bMic').textContent=on?'⏹':'🎤';$('#bMic').classList.toggle('rec',on)}
function stopMic(){micStop=true;clearTimeout(recT);try{rec&&rec.stop()}catch(e){}micUi(false)}
function micFail(code){stopMic();say('');warn(MIC_ERR[code]||('Voice error: '+code),null,true)}
async function listen(){
 if(micOn)return stopMic();
 if(inFrame||!SR||!window.isSecureContext)return warn('Open this page directly in Chrome for voice (voice only works in a normal browser tab over HTTPS).',null,true);
 clearWarn();
 try{const st=await navigator.mediaDevices.getUserMedia({audio:true});st.getTracks().forEach(t=>t.stop())}catch(e){return micFail(e.name==='NotFoundError'?'audio-capture':'not-allowed')}
 micStop=false;micUi(true);say('Listening… say the marks');let last=Date.now(),got=false,bad=false;
 const arm=()=>{clearTimeout(recT);recT=setTimeout(()=>{if(micOn&&!got)micFail('no-speech')},8000)};arm();
 const run=()=>{if(!micOn||micStop)return;rec=new SR();rec.lang=prefs.vlang;rec.continuous=false;rec.interimResults=true;rec.maxAlternatives=3;
  rec.onresult=e=>{last=Date.now();arm();const r=e.results[e.results.length-1];let n=null;for(let j=0;j<r.length&&n==null;j++)n=wordsToNum(r[j].transcript);
   say('Heard: '+r[0].transcript);if(n!=null){$('#marks').value=n;$('#marks').className=''}
   if(r.isFinal){got=true;stopMic();say(n!=null?`Heard "${r[0].transcript}" → ${n}. Press Next to save.`:`Heard "${r[0].transcript}" but no number. Tap 🎤 to try again.`)}};
  rec.onerror=e=>{if(e.error==='aborted'||e.error==='no-speech')return;bad=true;micFail(e.error)};
  rec.onend=()=>{if(!micOn||micStop||got||bad)return;if(Date.now()-last<8000)setTimeout(run,200);else micFail('no-speech')};
  try{rec.start()}catch(e){}};
 run()}
/* ===== render + events ===== */
function render(){const f=F();$('#v-empty').hidden=!!f;
 $$('main>section').forEach(s=>s.hidden=true);$('#nav').style.display=f?'flex':'none';
 $('#tabs').innerHTML=S.files.map(x=>`<button data-f="${x.id}" class="${x.id===S.cur?'on':''}">${esc(x.name.replace(/\.[^.]+$/,''))}</button>`).join('')+'<button data-act="add">＋ Add file</button>';
 if(!f){const e=$('#v-empty');e.hidden=false;e.innerHTML=`<div class="card" style="text-align:center;padding:28px 14px"><h2 style="margin-top:0">Upload an Excel file to begin</h2><p class="mu">Pick the Roll and Marks columns once. Your entries are saved on this device after every roll.</p><button class="pri" data-act="add" style="min-height:56px;width:100%">Choose Excel file (.xlsx / .xls)</button><div class="row" style="margin-top:10px"><button data-act="restore" class="grow">Import backup</button></div></div>`;return}
 $$('#nav button').forEach(b=>b.classList.toggle('on',b.dataset.v===S.view));$('#v-'+S.view).hidden=false;
 ({entry:renderEntry,bundle:renderBundle,report:renderReport,settings:renderSettings})[S.view]();
 if(S.view==='entry'&&matchMedia('(pointer:fine)').matches)$('#marks').focus()}
const ACT={add:()=>$('#fi').click(),goBundle:()=>{S.view='bundle';render()},
 adj:(el)=>{const f=F();f.bundle.adj+=+el.dataset.d;save(f);S.view==='bundle'?renderBundle():renderStrip()},
 review:reviewBundle,finish:finishBundle,
 resetB:async()=>{const f=F();if(await danger('Reset this bundle? The entered count restarts at 0 (marks already in the sheet are kept).')){f.bundle.ent=[];f.bundle.adj=0;await save(f);render()}},
 dlBundles:()=>{const f=F();sheetFile([['Bundle','Entered','Expected','Difference','From roll','To roll','Note','Started','Finished'],...f.bundles.map(x=>[x.no,x.entered,x.expected,x.diff,x.from,x.to,x.note,fmt(x.start),fmt(x.end)])],'Bundles',f.name.replace(/\.[^.]+$/,'')+'_bundles.xlsx')},
 dlLog:()=>{const f=F();sheetFile([['Time','Roll','Old','New','Type','Bundle','Undone'],...f.log.map(e=>[fmt(e.t),e.roll,disp(e.old),disp(e.nw),e.kind,e.b??'',e.undone?'yes':''])],'Log',f.name.replace(/\.[^.]+$/,'')+'_log.xlsx')},
 remap:()=>remap(F()),dlXlsx:()=>downloadXlsx(F()),backup,restore:()=>$('#fr').click(),testFx:()=>{beep(true);setTimeout(()=>beep(false),700)},
 clearMarks:async()=>{const f=F();if(await danger('Clear ALL marks in "'+f.name+'"? Old values stay in the entry log.')){f.rows.forEach(r=>{if(r.m!=null){f.log.push({id:uid(),t:Date.now(),roll:r.k,old:r.m,nw:null,kind:'clear',b:null});r.m=null}});if(f.bundle)f.bundle.ent=[];await save(f);render()}},
 delFile:async()=>{const f=F();if(await danger('Delete "'+f.name+'" and all its marks, bundles and logs from this device? Download it first.')){S.files=S.files.filter(x=>x!==f);delete BUF[f.id];await tx('meta','readwrite',s=>s.delete(f.id));await tx('bufs','readwrite',s=>s.delete(f.id));S.cur=S.files[0]?.id||null;gridBuilt=null;render()}}};
document.addEventListener('click',e=>{const t=e.target.closest('[data-act],[data-f],#grid button,[data-g],#nav button');if(!t)return;
 if(t.dataset.act)return ACT[t.dataset.act](t);if(t.dataset.f)return switchFile(t.dataset.f);
 if(t.dataset.g){gridF=t.dataset.g;renderGridChips();F().rows.forEach((_,i)=>updCell(i));return}
 if(t.dataset.v){S.view=t.dataset.v;return render()}if(t.dataset.i!=null)setPos(+t.dataset.i)});
$('#bNext').onclick=()=>tryCommit();$('#bPrev').onclick=()=>go(-1);$('#bUndo').onclick=undoLast;
$('#marks').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();tryCommit()}});$('#marks').addEventListener('input',()=>{$('#marks').className='';if(!$('#warn').hidden)clearWarn()});
$('#q').addEventListener('input',suggest);$('#q').addEventListener('keydown',e=>{if(e.key==='Enter'){const q=bn($('#q').value);if(!jumpTo(q)){const b=$('#sug button');b?b.click():toast('Roll not found');$('#q').value='';$('#sug').innerHTML=''}}});
$('#fi').onchange=async e=>{for(const f of e.target.files)await addFile(f);e.target.value=''};$('#fr').onchange=e=>{if(e.target.files[0])restore(e.target.files[0]);e.target.value=''};
$('#bTheme').onclick=()=>{prefs.theme={auto:'dark',dark:'light',light:'auto'}[prefs.theme];savePrefs();applyTheme();toast('Theme: '+prefs.theme)};

if(SR||inFrame){$('#bMic').hidden=false;$('#bMic').onclick=listen}

window.addEventListener('beforeunload',e=>{if(pending>0||$('#marks').value.trim()){e.preventDefault();e.returnValue=''}});
/* ===== keypad, hardened inputs, fullscreen, keyboard-aware layout ===== */
function applyKeypad(){document.body.classList.toggle('kp',!!prefs.keypad);$('#marks').setAttribute('inputmode',prefs.keypad?'none':'decimal')}
$('#kp').innerHTML=['1','2','3','4','5','6','7','8','9','.','0','⌫'].map(k=>`<button data-k="${k}">${k}</button>`).join('')+'<button data-k="prev">◀ Prev</button><button data-k="next" class="pri">Next ▶</button>';
$('#kp').addEventListener('click',e=>{const k=e.target.closest('[data-k]')?.dataset.k;if(!k)return;const m=$('#marks');
 if(k==='next')return tryCommit();if(k==='prev')return go(-1);
 if(!$('#warn').hidden)clearWarn();m.className='';
 if(k==='⌫')m.value=m.value.slice(0,-1);else if(k==='.'){if(!m.value.includes('.'))m.value+=m.value?'.':'0.'}else m.value+=k});
let hc=0;const HA={autocomplete:'off',autocorrect:'off',autocapitalize:'off',spellcheck:'false','data-lpignore':'true','data-form-type':'other',enterkeyhint:'next'};
function harden(){document.querySelectorAll('input,textarea').forEach(el=>{if(el.type==='checkbox'||el.type==='file'||el.dataset.h)return;el.dataset.h=1;for(const k in HA)el.setAttribute(k,HA[k]);el.setAttribute('name','f'+(++hc)+'x')})}
new MutationObserver(harden).observe(document.body,{childList:true,subtree:true});harden();
const FS=document.documentElement,fsReq=FS.requestFullscreen||FS.webkitRequestFullscreen,standalone=matchMedia('(display-mode: standalone)').matches||navigator.standalone;
if(fsReq){$('#bFs').hidden=false;$('#bFs').onclick=()=>{try{(document.fullscreenElement||document.webkitFullscreenElement)?(document.exitFullscreen||document.webkitExitFullscreen).call(document):fsReq.call(FS)}catch(e){}}}
else if(!standalone&&!ls.get('hintX',false)){const h=$('#hint');h.hidden=false;h.innerHTML='For full screen: tap Share → <b>Add to Home Screen</b>, then open from the home screen.<div class="row"><button class="sm" id="hintX">Got it</button></div>';$('#hintX').onclick=()=>{h.hidden=true;ls.set('hintX',true)}}
if(window.visualViewport){const vv=visualViewport;vv.addEventListener('resize',()=>{const kb=innerHeight-vv.height>120;document.body.classList.toggle('kb',kb);
 if(kb){const a=document.activeElement;if(a&&(a.id==='marks'||a.id==='q'))setTimeout(()=>(a.id==='q'?a:$('#mrow')).scrollIntoView({block:'center',behavior:'smooth'}),60)}})}
applyKeypad();
/* ===== init ===== */
(async()=>{applyTheme();wake();try{navigator.storage?.persist?.()}catch(e){}
 const all=await tx('meta','readonly',s=>s.getAll());if(all===undefined)toast('Storage unavailable: data will not be kept!');
 for(const f of all||[]){BUF[f.id]=await tx('bufs','readonly',s=>s.get(f.id));S.files.push(f);reindex(f)}
 S.files.sort((a,b)=>a.created-b.created);const c=ls.get('cur',null);S.cur=S.files.some(f=>f.id===c)?c:S.files[0]?.id||null;render()})();
